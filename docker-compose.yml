services:

  logging-service:
    build: ./logging-service
    container_name: logging-service
    restart: always
    environment:
      PORT: 8080
    ports: 
      - '${LED_HUB_LOGGER_PORT:-8080}:8080' 
    networks:
      - led-hub-network
    volumes:
      - led-hub-log-data:/app/data

  server:
    build: ./hub-server
    container_name: led-hub-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-led-hub-server}
      DB_PASSWORD: ${MYSQL_PASSWORD:-led-hub-db-pass}
      DB_NAME: ${MYSQL_DATABASE:-led-hub}
      SERVER_PORT: 2000
      LOGGING_SERVICE_ENDPOINT: http://logging-service:8080
    ports:
      - '${LED_HUB_APP_PORT:-2000}:2000' 
    networks:
      - led-hub-network
    platform: linux/amd64

  webapp:
    build:
      context: ./hub-webapp
      args: 
        BACKEND_HOST: server
        BACKEND_PORT: 2000
        LOGGER_HOST: logging-service
        LOGGER_PORT: 8080
        WEBAPP_PORT: ${WEBAPP_PORT:-80}
    restart: always
    ports:
      - '${LED_HUB_WEBAPP_PORT:-80}:80' 
    depends_on:
      - server
    networks:
      - led-hub-network

networks:
  led-hub-network:

volumes:
  led-hub-data:
  led-hub-log-data:
